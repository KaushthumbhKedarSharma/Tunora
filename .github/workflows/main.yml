name: Build Tunora APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Unpack project and create Android shell
        run: |
          unzip -q tunora_full.zip
          flutter create --org com.tunora --project-name tunora --platforms android app
          rm -rf app/lib
          cp -r tunora/lib app/lib
          cp tunora/pubspec.yaml app/pubspec.yaml
          python3 tunora/tools/patch_android.py app

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tunora-build-${{ github.run_number }}
          name: Tunora build ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
